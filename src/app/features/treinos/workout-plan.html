<div class="trainings">
  <!-- Criar novo plano -->
  <section class="card">
    <div class="section-title">
      <h3>Novo treino</h3>
      <!-- <span class="hint">defina um nome e adicione</span> -->
    </div>

    <div class="row">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nome do treino</mat-label>
        <input matInput [(ngModel)]="novoTreino.nome" />
      </mat-form-field>

      <button class="btn" (click)="adicionarTreino()">Adicionar</button>
    </div>
  </section>

  <!-- Estado vazio -->
  <section class="card empty" *ngIf="!workoutPlan?.length">
    <p class="muted">Nenhum treino cadastrado ainda.</p>
  </section>

  <!-- Lista de planos -->
  <section class="grid" *ngIf="workoutPlan?.length">
    <article class="card treino" *ngFor="let plano of workoutPlan">
      <header class="treino-head" (click)="navegarParaEditar(plano.nome)">
        <h3>{{ plano.nome }}</h3>
      </header>

      <div class="actions">
        <button class="btn danger" (click)="excluirTreino(plano.nome)">Excluir</button>
        <button class="btn ghost" (click)="navegarParaEditar(plano.nome)">Editar</button>
      </div>
    </article>
  </section>
</div>
