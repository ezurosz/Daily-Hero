<div class="workout-edit">
  <header class="page-head">
    <h2 class="title">{{ treino.nome }}</h2>
  </header>

  <!-- Lista de exercícios -->
  <section class="card" *ngFor="let exercicio of treino.exercicios; let i = index">
    <div class="card-head">
      <h3 class="card-title">{{ exercicio.nome }}</h3>
      <button class="icon danger" (click)="removerExercicio(i)" aria-label="Remover exercício">
        ✕
      </button>
    </div>

    <div class="series" *ngFor="let serie of exercicio.series; let j = index">
      <div class="serie-title">Série {{ j + 1 }}</div>

      <div class="row">
        <mat-form-field appearance="outline" class="ff w-1">
          <mat-label>Reps</mat-label>
          <input matInput type="number" [(ngModel)]="serie.reps" />
          <mat-hint *ngIf="sugestoes[i]?.[j]?.reps">
            Sugestão: {{ sugestoes[i][j].reps }} reps
          </mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="ff w-1">
          <mat-label>Carga (kg)</mat-label>
          <input matInput type="number" [(ngModel)]="serie.carga" />
          <mat-hint *ngIf="sugestoes[i]?.[j]?.carga">
            Sugestão: {{ sugestoes[i][j].carga }} kg
          </mat-hint>
        </mat-form-field>
      </div>

      <div class="actions end">
        <button class="btn ghost" (click)="salvarSerie(i, j)">Salvar</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn" (click)="adicionarSerie(exercicio)">+ Série</button>
      <button
        class="btn danger"
        (click)="removerSerie(exercicio, exercicio.series.length - 1)"
        [disabled]="exercicio.series.length === 0"
      >
        Remover série
      </button>
    </div>
  </section>

  <!-- Novo exercício -->
  <section class="card new-ex">
    <div class="card-head">
      <h3 class="card-title">Novo exercício</h3>
      <span class="hint">adicione à lista</span>
    </div>

    <mat-form-field appearance="outline" class="ff w-full">
      <mat-label>Nome do novo exercício</mat-label>
      <input matInput [(ngModel)]="novoExercicio.nome" />
    </mat-form-field>

    <div class="actions">
      <button class="btn" (click)="adicionarExercicio()">Adicionar exercício</button>
    </div>
  </section>
</div>
